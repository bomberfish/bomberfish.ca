	<body>
		<!-- page background: photo, film grain, a fade at the end of the page,
		     then the screen-fixed rain canvas (src/lib/rain.ts goes in
		     .page-bg-fixed). Ordinary content, not
		     position: fixed, so Safari draws it under its toolbars; see
		     .page-bg in src/style.css -->
		<div class="page-bg" aria-hidden="true">
			<div class="page-bg-photo"></div>
			<div class="page-bg-grain"></div>
			<div class="page-bg-end"></div>
			<div class="page-bg-fixed"></div>
		</div>
		<!--ssr-body-->
		<script type="module" src="/src/main-client.ts"></script>
		<link rel="stylesheet" href="/typography.css" />
		<noscript
			><img
				allow-params="higherdimension"
				collect-dnt="true"
				data-allow-params="higher-dimension"
				data-collect-dnt="true"
				src="https://site-stats.bomberfish.ca/noscript.gif"
				alt=""
				referrerpolicy="no-referrer-when-downgrade"
		/></noscript>
		<script
			async
			defer
			data-collect-dnt="true"
			data-allow-params="higherdimension"
			src="https://site-stats.bomberfish.ca/latest.js"
		></script>
	</body>
